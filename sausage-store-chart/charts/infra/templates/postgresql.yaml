apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgresql
  namespace: {{ .Release.Namespace }}
spec:
  ports: [{name: db, port: 5432, targetPort: db}]
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgresql}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgresql
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: {{ .Release.Name }}-postgresql
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgresql}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgresql}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image | quote }}

          ports: [{name: db, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: store}
            - {name: POSTGRES_USER, value: store}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.global.existingSecret }}, key: postgres-password}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          readinessProbe:
            tcpSocket: {port: db}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}


  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.postgresql.storageClass }}
        storageClassName: {{ .Values.postgresql.storageClass | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.postgresql.storage | quote }}}
