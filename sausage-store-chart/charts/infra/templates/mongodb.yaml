apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mongodb
  namespace: {{ .Release.Namespace }}
spec:
  ports: [{name: db, port: 27017, targetPort: db}]
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: mongodb}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-mongodb
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: {{ .Release.Name }}-mongodb
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: mongodb}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: mongodb}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mongodb
          image: {{ .Values.mongodb.image | quote }}
          args: ["--wiredTigerCacheSizeGB", "0.25"]
          ports: [{name: db, containerPort: 27017}]
          env:
            - {name: MONGO_INITDB_ROOT_USERNAME, value: root}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.global.existingSecret }}, key: mongo-root-password}
            - {name: MONGO_INITDB_DATABASE, value: sausage-store}
            - name: REPORTS_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.global.existingSecret }}, key: reports-password}
          resources:
            {{- toYaml .Values.mongodb.resources | nindent 12 }}
          readinessProbe:
            tcpSocket: {port: db}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /data/db}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
      volumes:
        - name: init
          configMap: {name: {{ .Release.Name }}-mongo-init}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.mongodb.storageClass }}
        storageClassName: {{ .Values.mongodb.storageClass | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.mongodb.storage | quote }}}
