apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend-report
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sausage.labels" . | nindent 4 }}
spec:
{{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicas }}
{{- end }}
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: backend-report}
  template:
    metadata:
      labels:
        {{- include "sausage.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend-report
          image: "{{ .Values.global.imageRegistry }}/sausage-backend-report:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - name: PORT
              value: "8080"
            - name: DB
              valueFrom:
                secretKeyRef: {name: {{ .Values.global.existingSecret }}, key: mongodb-uri}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /api/v1/health, port: http}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /api/v1/health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/v1/health, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - {name: tmp, mountPath: /tmp}

      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}

