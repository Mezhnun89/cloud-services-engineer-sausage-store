global:
  imageRegistry: mezhnun
  imageTag: 1.0.0
  existingSecret: sausage-store-db
  environment: training
backend:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 700m
      memory: 580Mi
  vpa:
    enabled: true
backend-report:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 150m
      memory: 96Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPU: 75
frontend:
  replicas: 1
  fqdn: front-mezhnun.2sem.students-projects.ru
  ingressClassName: nginx
  tlsSecret: 2sem-students-projects-wildcard-secret
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
infra:
  postgresql:
    image: postgres:16-alpine
    storage: 2Gi
    storageClass: ''
    resources:
      requests:
        cpu: 150m
        memory: 128Mi
      limits:
        cpu: 450m
        memory: 384Mi
  mongodb:
    image: mongo:7.0
    storage: 2Gi
    storageClass: ''
    resources:
      requests:
        cpu: 150m
        memory: 192Mi
      limits:
        cpu: 450m
        memory: 512Mi
