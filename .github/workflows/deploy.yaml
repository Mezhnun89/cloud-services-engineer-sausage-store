name: Sausage Store Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sausage-production
  cancel-in-progress: false
env:
  NEXUS_HELM_REPO: ${{ secrets.NEXUS_HELM_REPO }}
  NEXUS_HELM_REPO_USER: ${{ secrets.NEXUS_HELM_REPO_USER }}
  NEXUS_HELM_REPO_PASSWORD: ${{ secrets.NEXUS_HELM_REPO_PASSWORD }}
jobs:
  build_and_push_to_docker_hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push three immutable images
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
        run: |
          set -euo pipefail
          for component in backend frontend backend-report; do
            docker buildx build --push --build-arg VERSION="$GITHUB_SHA" \
              -t "$DOCKER_USER/sausage-$component:$GITHUB_SHA" "$component"
          done
  add_helm_chart_to_nexus:
    runs-on: ubuntu-latest
    needs: build_and_push_to_docker_hub
    outputs:
      chart_version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0
      - id: package
        name: Package and publish chart
        run: |
          set -euo pipefail
          version="1.0.${GITHUB_RUN_NUMBER}"
          helm lint sausage-store-chart
          helm package sausage-store-chart --version "$version" --app-version "$GITHUB_SHA" -d /tmp
          curl --fail --show-error --silent --user "$NEXUS_HELM_REPO_USER:$NEXUS_HELM_REPO_PASSWORD" \
            --upload-file "/tmp/sausage-store-$version.tgz" "${NEXUS_HELM_REPO%/}/sausage-store-$version.tgz"
          echo "version=$version" >> "$GITHUB_OUTPUT"
  deploy_helm_chart_to_kubernetes:
    runs-on: ubuntu-latest
    needs: add_helm_chart_to_nexus
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      DB_SECRET_JSON: ${{ secrets.DB_SECRET_JSON }}
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      CHART_VERSION: ${{ needs.add_helm_chart_to_nexus.outputs.chart_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0
      - name: Deploy chart downloaded from Nexus
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KUBE_CONFIG" > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          namespace=$(kubectl config view --minify -o jsonpath='{..namespace}')
          test -n "$namespace"
          printf '%s' "$DB_SECRET_JSON" | kubectl -n "$namespace" apply -f -
          helm repo add nexus "$NEXUS_HELM_REPO" --username "$NEXUS_HELM_REPO_USER" --password "$NEXUS_HELM_REPO_PASSWORD"
          helm repo update nexus
          helm upgrade --install sausage-store nexus/sausage-store --version "$CHART_VERSION" \
            -n "$namespace" --set-string global.imageRegistry="$DOCKER_USER" \
            --set-string global.imageTag="$GITHUB_SHA" --atomic --timeout 12m --history-max 3
          kubectl get pods,ingress,hpa,vpa -n "$namespace"
          helm list -n "$namespace"
